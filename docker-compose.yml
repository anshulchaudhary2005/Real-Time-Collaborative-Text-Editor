version: '3.8'

services:
  # 1. PostgreSQL Database (Durable Storage, Operation Log, Snapshots, Locks)
  postgres:
    image: postgres:16-alpine
    container_name: texteditor
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: collab_editor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collab_editor"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Message Broker (Cross-Instance Pub/Sub Fan-out)
  redis:
    image: redis:7-alpine
    container_name: collab_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Optional Full-Cluster Multi-Node Services (run with: docker-compose --profile cluster up) ---
  backend1:
    profiles: ["cluster"]
    build: .
    container_name: collab_backend_1
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/collab_editor
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend2:
    profiles: ["cluster"]
    build: .
    container_name: collab_backend_2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/collab_editor
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 8080
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  loadbalancer:
    profiles: ["cluster"]
    image: nginx:alpine
    container_name: collab_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2

volumes:
  postgres_data:
